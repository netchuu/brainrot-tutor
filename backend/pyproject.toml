[project]
name = "brainrot-tutor-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "edge-tts>=7.3.1",
    "fastapi[standard]>=0.162.0",
    "google-genai>=2.33.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.16.1",
]

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.2",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "BLE", "RUF", "N", "ANN", "FIX", "TID252", "PLC0415"]

[tool.ruff.lint.per-file-ignores]
# Tests use Russian fixture text, which the confusable-character rules misread as typos.
"tests/**" = ["RUF001", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app", "tests", "validate"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = [".", "../contracts/tools"]
testpaths = ["tests"]
markers = ["live: calls real Gemini, Groq, edge-tts and Pexels (needs keys in backend/.env)"]
addopts = "-m 'not live'"
